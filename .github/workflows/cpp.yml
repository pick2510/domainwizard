name: Native C++ build

on:
  push:
    branches: [master, cplusplus]
  pull_request:
    branches: [master, cplusplus]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    # Backstop for a hang outside ctest's own --timeout (e.g. mid-build, or
    # a package/upload step) - a normal run finishes in well under 10
    # minutes on any of the three OSes, so this only ever fires on a
    # genuinely wedged job instead of burning the default multi-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Not the fix for the DLL_PROCESS_DETACH deadlock below (fastExit()
      # in tests/fast_exit.hpp is) - kept anyway as cheap, harmless
      # insurance against unrelated Defender-induced slowness on freshly-
      # built, unsigned .exe's.
      - name: Exclude workspace from Windows Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "D:\a\_temp\msys64"
          Add-MpPreference -ExclusionProcess "c++.exe","cc1plus.exe","ctest.exe","ninja.exe"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgdal-dev libproj-dev catch2 patchelf
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja qt gdal proj catch2 dylibbundler
      # MSYS2/MinGW64 rather than MSVC+vcpkg: its package repo already has
      # prebuilt Qt6/GDAL/PROJ/Catch2 (matching the apt/brew jobs' approach
      # of using the OS's own package manager instead of building
      # dependencies from source), and its GCC accepts the same
      # -Wall/-Wextra/-Wpedantic flags CMakeLists.txt already sets
      # unconditionally - MSVC's cl.exe does not take those.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-gdal
            mingw-w64-x86_64-proj
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libgeotiff
            mingw-w64-x86_64-catch
            zip
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build-cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build-cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -S . -B build-cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug
      # Linux/macOS share these two (default shell); Windows needs its own
      # copies with shell: msys2 {0} - the `shell:` field's expression
      # evaluator does not expose the `runner` context (unlike `if:`), so a
      # single `shell: ${{ runner.os == ... }}` step is rejected outright as
      # an invalid workflow file before any job even starts.
      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build-cpp
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build-cpp
      # --timeout caps each individual test case (locally the slowest, the
      # whole UI suite as ONE ctest entry, takes ~3s) - generous headroom
      # while still turning a genuine hang into a clear failure instead of
      # silently consuming the job's multi-hour default timeout.
      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build-cpp --output-on-failure --timeout 120
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build-cpp --output-on-failure --timeout 120
      # Packaged separately from the Debug build/test above (its own fresh
      # Release, BUILD_TESTING=OFF configure+build) - only reached once
      # tests have actually passed, matching what build-portable-cpp.sh/
      # build-portable-macos.sh already do when run by hand.
      - name: Package portable Linux bundle
        if: runner.os == 'Linux'
        run: ./build-portable-cpp.sh
      - name: Package portable macOS app
        if: runner.os == 'macOS'
        run: ./build-portable-macos.sh
      - name: Package portable Windows bundle
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./build-portable-windows.sh
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wrftools-linux
          path: dist/wrftools-cpp/
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wrftools-macos
          path: dist/wrftools-macos.zip
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wrftools-windows
          path: dist/wrftools-windows.zip
