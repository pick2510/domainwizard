name: Native C++ build

on:
  push:
    branches: [master, cplusplus]
  pull_request:
    branches: [master, cplusplus]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    # Backstop for a hang outside ctest's own --timeout (e.g. mid-build, or
    # a package/upload step) - a normal run finishes in well under 10
    # minutes on any of the three OSes, so this only ever fires on a
    # genuinely wedged job instead of burning the default multi-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Every single test hangs for exactly --timeout's duration even after
      # switching the test binaries to std::_Exit() (an immediate,
      # unconditional OS-level process kill - no atexit/static-destructor
      # teardown can run), which rules out an in-process hang entirely: the
      # process is gone, but ctest is still blocked waiting for something.
      # The classic cause on GitHub-hosted Windows runners is Windows
      # Defender's real-time scanner duplicating/holding a handle on a
      # freshly-built, unsigned .exe (or its stdout pipe) during its scan,
      # which keeps the pipe ctest reads from open until the scan clears -
      # exclude the workspace and MSYS2's own install dir up front so newly
      # compiled binaries are never queued for scanning in the first place.
      - name: Exclude workspace from Windows Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "D:\a\_temp\msys64"
          Add-MpPreference -ExclusionProcess "c++.exe","cc1plus.exe","ctest.exe","ninja.exe"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgdal-dev libproj-dev catch2 patchelf
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja qt gdal proj catch2 dylibbundler
      # MSYS2/MinGW64 rather than MSVC+vcpkg: its package repo already has
      # prebuilt Qt6/GDAL/PROJ/Catch2 (matching the apt/brew jobs' approach
      # of using the OS's own package manager instead of building
      # dependencies from source), and its GCC accepts the same
      # -Wall/-Wextra/-Wpedantic flags CMakeLists.txt already sets
      # unconditionally - MSVC's cl.exe does not take those.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-gdal
            mingw-w64-x86_64-proj
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libgeotiff
            mingw-w64-x86_64-catch
            zip
      # A plain hello-world (no GDAL/Qt) ran in 8.8ms even on the previous
      # windows-2025-vs2026 image - ruling out the runner image, Defender
      # (same freshly-built/unsigned .exe profile as the ones that DO
      # hang), ctest, and the MSYS2 bash wrapper all at once, since none of
      # those differ between it and wrftools_core_tests.exe (which still
      # hangs on windows-2022 too). The one remaining difference is what
      # gets linked in: GDAL::GDAL, Qt6::Core, Qt6::Gui. These two probes
      # link ONLY Qt or ONLY GDAL (never both) to binary-search which one
      # is responsible - each gets its own bounded wait (Start-Process +
      # WaitForExit, not just `&`) so a hang in one doesn't block learning
      # the other's result in the same run.
      - name: Diagnose whether Qt or GDAL causes the hang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $mingw = "$env:RUNNER_TEMP\msys64\mingw64"
          $env:PATH = "$mingw\bin;$env:PATH"

          function Run-Probe($name, $exe) {
            Write-Host "--- $name ---"
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -NoNewWindow -PassThru
            $finished = $p.WaitForExit(20000)
            $sw.Stop()
            if ($finished) {
              Write-Host "$name finished in $($sw.Elapsed), exit code $($p.ExitCode)"
            } else {
              Write-Host "$name HUNG past 20s - killing it"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }

          '#include <cstdio>
          #include <cstdlib>
          #include <QImage>
          int main() { QImage image(4, 4, QImage::Format_RGBA8888); puts("probe_qt ok"); std::_Exit(0); }' | Out-File -Encoding ascii probe_qt.cpp
          $qtFlags = (& "$mingw\bin\pkg-config.exe" --cflags --libs Qt6Core Qt6Gui) -split ' '
          & "$mingw\bin\g++.exe" -std=c++20 probe_qt.cpp -o probe_qt.exe @qtFlags
          Run-Probe "probe_qt" ".\probe_qt.exe"

          '#include <cstdio>
          #include <cstdlib>
          #include <gdal_priv.h>
          int main() { GDALAllRegister(); puts("probe_gdal ok"); std::_Exit(0); }' | Out-File -Encoding ascii probe_gdal.cpp
          & "$mingw\bin\g++.exe" -std=c++20 probe_gdal.cpp -o probe_gdal.exe "-I$mingw\include" "-L$mingw\lib" -lgdal
          Run-Probe "probe_gdal" ".\probe_gdal.exe"

          # Neither alone hung - combines both AND actually opens a real
          # netCDF fixture via GDAL (closer to what WrfFile's constructor,
          # test #1's own hang site, does than just GDALAllRegister()) to
          # isolate whether it's the Qt+GDAL combination, or netCDF/HDF5
          # file I/O specifically, that's responsible.
          '#include <cstdio>
          #include <cstdlib>
          #include <QImage>
          #include <gdal_priv.h>
          int main() {
              GDALAllRegister();
              QImage image(4, 4, QImage::Format_RGBA8888);
              auto* ds = GDALOpen("NETCDF:tests/fixtures/wrfout_with_1d_var.nc:T2", GA_ReadOnly);
              puts(ds ? "opened dataset" : "open FAILED");
              if (ds) GDALClose(ds);
              puts("probe_combined ok");
              std::_Exit(0);
          }' | Out-File -Encoding ascii probe_combined.cpp
          & "$mingw\bin\g++.exe" -std=c++20 probe_combined.cpp -o probe_combined.exe @qtFlags "-I$mingw\include" "-L$mingw\lib" -lgdal
          Run-Probe "probe_combined" ".\probe_combined.exe"

          # probe_combined hung; neither Qt alone nor GDAL alone did. Splits
          # that result one more way: does merely LINKING both together
          # hang (no GDALOpen call at all), or is it specifically opening a
          # real netCDF/HDF5 file with both linked in?
          '#include <cstdio>
          #include <cstdlib>
          #include <QImage>
          #include <gdal_priv.h>
          int main() {
              GDALAllRegister();
              QImage image(4, 4, QImage::Format_RGBA8888);
              puts("probe_combined_noopen ok");
              std::_Exit(0);
          }' | Out-File -Encoding ascii probe_combined_noopen.cpp
          & "$mingw\bin\g++.exe" -std=c++20 probe_combined_noopen.cpp -o probe_combined_noopen.exe @qtFlags "-I$mingw\include" "-L$mingw\lib" -lgdal
          Run-Probe "probe_combined_noopen" ".\probe_combined_noopen.exe"
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build-cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build-cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -S . -B build-cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug
      # Linux/macOS share these two (default shell); Windows needs its own
      # copies with shell: msys2 {0} - the `shell:` field's expression
      # evaluator does not expose the `runner` context (unlike `if:`), so a
      # single `shell: ${{ runner.os == ... }}` step is rejected outright as
      # an invalid workflow file before any job even starts.
      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build-cpp
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build-cpp
      # --timeout caps each individual test case (locally the slowest, the
      # whole UI suite as ONE ctest entry, takes ~3s) - generous headroom
      # while still turning a genuine hang into a clear failure instead of
      # silently consuming the job's multi-hour default timeout.
      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build-cpp --output-on-failure --timeout 120
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build-cpp --output-on-failure --timeout 120
      # Packaged separately from the Debug build/test above (its own fresh
      # Release, BUILD_TESTING=OFF configure+build) - only reached once
      # tests have actually passed, matching what build-portable-cpp.sh/
      # build-portable-macos.sh already do when run by hand.
      - name: Package portable Linux bundle
        if: runner.os == 'Linux'
        run: ./build-portable-cpp.sh
      - name: Package portable macOS app
        if: runner.os == 'macOS'
        run: ./build-portable-macos.sh
      - name: Package portable Windows bundle
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./build-portable-windows.sh
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wrftools-linux
          path: dist/wrftools-cpp/
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wrftools-macos
          path: dist/wrftools-macos.zip
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wrftools-windows
          path: dist/wrftools-windows.zip
