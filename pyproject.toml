[project]
name = "wrftools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "strebdom", email = "dominik.strebel@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "f90nml>=1.5",
    "gdal==3.12.4",
    "numpy>=2.4.6",
    "pyqt6>=6.11.0",
    "requests>=2.34.2",
]

[project.scripts]
wrftools = "wrftools:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
]
